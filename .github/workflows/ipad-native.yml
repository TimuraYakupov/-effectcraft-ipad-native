name: Native iPad preview

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ipad-build24-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-frontend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned source
        run: |
          bash scripts/prepare_v018.sh
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Update iOS workspace lockfile for 0.18.0
        working-directory: effectcraft
        run: cargo +1.95.0 update --workspace
      - name: Reproduce build 14 native media-drop regression
        working-directory: effectcraft
        run: python3 ../scripts/verify_touch_drop_regression_v018.py
      - name: Test native Bridge, input, settings and media drops
        working-directory: effectcraft
        run: cargo +1.95.0 test --locked -p effectcraft-ios --features eframe/x11
      - name: Test fonts and text layout
        working-directory: effectcraft
        run: cargo +1.95.0 test --locked -p effectcraft-text --lib
      - name: Test Keyframe Velocity multi-selection regression
        working-directory: effectcraft
        run: cargo +1.95.0 test --locked -p effectcraft-ui-egui --features eframe/x11 --lib velocity_multiselection_tests
      - name: Test timeline trimming
        working-directory: effectcraft
        run: cargo +1.95.0 test --locked -p effectcraft-ui-egui --features eframe/x11 --test it ui_timeline_trim
      - name: Test H264 MP4 round trip
        working-directory: effectcraft
        run: cargo +1.95.0 test --locked -p effectcraft-export --test it h264_mp4_roundtrip
      - name: Test movie audio round trip
        working-directory: effectcraft
        run: cargo +1.95.0 test --locked -p effectcraft-export --test it movies_carry_audio
      - name: Test image sequence round trip
        working-directory: effectcraft
        run: cargo +1.95.0 test --locked -p effectcraft-export --test it image_sequences_roundtrip
  native-ipad:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      CARGO_BUILD_JOBS: '3'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Test UIKit keyboard responder on iPad Simulator
        run: python3 scripts/test_uikit_keyboard.py
      - name: Prepare pinned source
        run: |
          bash scripts/prepare_v018.sh
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 aarch64-apple-ios
      - name: Update iOS workspace lockfile for 0.18.0
        working-directory: effectcraft
        run: cargo +1.95.0 update --workspace
      - name: Locate iOS SDK
        run: |
          xcodebuild -version
          echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Check diagnostic journal and IPA packaging
        run: |
          rustc +1.95.0 --edition 2024 --test effectcraft/apps/effectcraft-ios/src/journal.rs -o /tmp/ec-journal-tests
          /tmp/ec-journal-tests
          rustc +1.95.0 --edition 2024 --test tests/archive_tests.rs -o /tmp/ec-project-zip-tests
          /tmp/ec-project-zip-tests
          cp effectcraft/apps/effectcraft-ios/src/key_codes.rs tests/hardware-keys/src/key_codes.rs
          cp effectcraft/apps/effectcraft-ios/src/keyboard.rs tests/hardware-keys/src/keyboard.rs
          cargo +1.95.0 test --locked --manifest-path tests/hardware-keys/Cargo.toml
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Compile iPad Files platform module
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -fobjc-arc -fmodules -Wall -Wextra -c platform/EffectCraftDocuments.m -o /tmp/effectcraft-documents.o
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -fobjc-arc -fmodules -Wall -Wextra -c platform/EffectCraftKeyboard.m -o /tmp/effectcraft-keyboard.o
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -fobjc-arc -fmodules -Wall -Wextra -c platform/EffectCraftAudio.m -o /tmp/effectcraft-audio.o
      - name: Compile native ARM64 app
        working-directory: effectcraft
        run: cargo +1.95.0 rustc --locked --release --target aarch64-apple-ios -p effectcraft-ios -- -C link-arg=/tmp/effectcraft-documents.o -C link-arg=/tmp/effectcraft-keyboard.o -C link-arg=/tmp/effectcraft-audio.o -C link-arg=-framework -C link-arg=AVFoundation -C link-arg=-framework -C link-arg=UIKit -C link-arg=-framework -C link-arg=Foundation -C link-arg=-framework -C link-arg=UniformTypeIdentifiers
      - name: Package unsigned IPA
        run: python3 scripts/package_ipa.py
      - name: Upload IPA and build details
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-Native-Preview
          path: output/
          if-no-files-found: error
          retention-days: 14


